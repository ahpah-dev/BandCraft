[package]
name = "bandcraft"
version = "0.1.0"
edition = "2024"
description = "BandCraft: an easy, BandLab-style music studio written in Rust"
license = "Unlicense"
readme = "README.md"
keywords = ["daw", "music", "audio", "egui"]

[dependencies]
cpal = "0.18.2"
eframe = "0.37.0"
hound = "3.5.1"
midir = "0.11.1"
midly = "0.5.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
